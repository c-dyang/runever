# ============================================================
# RunEver 配置 · 测试样例
# 编码: UTF-8 (无 BOM)
#
# 语法:
#   ! <分组名>  <类型>  [关键词...]        分组（类型: folder/ext/proc/text/always/fallback）
#     <标题>  [_快捷键]  | <动作>  <目标>   条目（缩进 2 空格 = 层级）
#   #                                      注释
#
# 动作类型:
#   run    启动程序（目标 = 命令行，首个 token 走路径缓存解析）
#   open   打开文件/文件夹
#   url    打开网址
#   action 调外部程序（cmd 管道）
#   send   发送文本
#   keys   发快捷键
#   group  纯分组标题
# ============================================================

# ---------- 文件夹 ----------
! 文件夹  folder
   LockHunter64      _L  | run LockHunter64.exe
   7-Zip              _7  | run 7zFM.exe
   解压到当前目录      _J  | run 7z.exe

# ---------- PDF ----------
! PDF  ext  pdf
   SumatraPDF        _S  | run SumatraPDF.exe
   用浏览器打开        _B  | run chrome.exe

# ---------- 图片 ----------
! 图片  ext  png jpg jpeg gif webp bmp
   用画图打开          _M  | run mspaint.exe
   用浏览器打开        _B  | run chrome.exe

# ---------- 文本 ----------
! 文本  ext  txt md log ini json
   记事本              _N  | run notepad.exe
   VS Code             _V  | run code.exe

# ---------- 压缩包 ----------
! 压缩包  ext  zip rar 7z
   7-Zip 解压          _7  | run 7zFM.exe

# ---------- 视频 ----------
! 视频  ext  mp4 mkv avi mov flv
   播放                _P  | run mpc-hc64.exe

# ---------- 浏览器（进程） ----------
! 浏览器  proc  chrome msedge firefox
   当前链接            _D  | action cmd  echo %clip%
   用 Chrome 打开      _C  | run chrome.exe
   用 Edge 打开        _E  | run msedge.exe
   打开 PowerShell     _P  | run pwsh.exe

# ---------- 资源管理器（进程） ----------
! 资源管理器  proc  explorer
   打开当前目录        _O  | open %file%
   在此处打开终端       _T  | run pwsh.exe

# ---------- 终端（进程） ----------
! 终端  proc  pwsh powershell cmd WindowsTerminal
   打开 PowerShell     _P  | run pwsh.exe
   Git Bash            _G  | run git.exe

# ---------- 选中文本 ----------
! 选中文本  text
   搜索                _S  | url https://www.bing.com/search?q=%s
   百度搜索            _B  | url https://www.baidu.com/s?wd=%s
   复制并打开          _C  | url https://%text%

# ---------- 永久显示 ----------
! 通用菜单  always
   工具                          | group
     PowerShell        _P  | run pwsh.exe
     Node.js           _N  | run node.exe
     curl              _C  | run curl.exe
     ffmpeg            _F  | run ffmpeg.exe
   系统                          | group
     资源管理器         _E  | run explorer.exe
     任务管理器         _T  | run taskmgr.exe
     控制面板           _C  | action cmd  control.exe
   常用                          | group
     计算器             _A  | run calc.exe
     AutoHotkey        _H  | run AutoHotkey64.exe

# ---------- 兜底 ----------
! 默认菜单  fallback
   打开 Everything     _V  | run Everything.exe
   Everything 搜索     _S  | action cmd  es.exe -n 20 "%clip%"
   打开文件所在目录     _O  | open %file%
   复制路径            _C  | send %file%
