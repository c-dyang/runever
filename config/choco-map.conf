# ============================================================
# RunEver choco 包名映射表（功能 B · 全盘自检）
# 编码: UTF-8 (无 BOM)
#
# 格式：程序名=choco 包名      （程序名小写，带 .exe）
# # 开头为注释。
#
# ★★ 纪律：本表**只收已联网核实存在的包名**，禁凭记忆填写 ★★
#   核实办法（只读，不装包）：
#     choco search --exact <包名>
#     或 OData：https://community.chocolatey.org/api/v2/Packages()?$filter=Id eq '<名>' and IsLatestVersion
#   核实证据：state\v6-choco-evidence.txt（2026-10-03 实跑）
#
#   未在本表命中的程序 ⇒ 自检报告标「待确认」并给出 `choco search <程序名>` 提示；
#   **绝不猜包名**（猜错比留空更坏：用户会装错东西）。
#   已知反例：googlechrome 在 OData 未命中 ⇒ 本表不含它。
#
#   系统自带程序（mspaint / taskmgr / calc / explorer）**不入本表** ——
#   它们"缺失"通常意味着系统异常，choco 不是正确解法（引擎会单独标注）。
#
#   本文件与 templates\choco-map.conf 必须保持逐字节一致（首启模板会复制过去）。
# ============================================================

# ---------- 已核实（exact Id 命中，2026-10-03）----------
7z.exe=7zip
7zfm.exe=7zip
code.exe=vscode
git.exe=git
ffmpeg.exe=ffmpeg
lockhunter64.exe=lockhunter
sumatrapdf.exe=sumatrapdf
mpc-hc64.exe=mpc-hc
msedge.exe=microsoft-edge
node.exe=nodejs
curl.exe=curl
pwsh.exe=powershell-core

# ---------- 明确不映射（待确认，引擎会自动给 choco search 提示）----------
# chrome.exe        googlechrome 未在 feed 命中 ⇒ 待确认，禁写入本表
# autohotkey64.exe  现有配置里的 AHK 解析器，包名未核实 ⇒ 待确认
# everything.exe    Everything 本体，包名未核实 ⇒ 待确认
# notepad.exe       系统自带（已进 IsSystemBuiltin 名单）；choco 的 notepadplusplus
#                   是另一个软件、不提供 notepad.exe ⇒ 不得映射过去
